    <!-- Aplica la paleta guardada antes del primer pintado, para que no se vea
         el destello del tema oscuro cuando el usuario dejó uno claro. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("unbroken-theme")
          var valid = [
            "forge", "forge-light", "volt", "volt-light",
            "toxic", "toxic-light", "royal", "royal-light",
          ]
          if (saved && valid.indexOf(saved) !== -1) {
            document.documentElement.setAttribute("data-theme", saved)
          }
        } catch (e) {}
      })()
    </script>
